server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 폴더 주소에 슬래시를 붙이는 리다이렉트가 컨테이너 내부 포트(80)가 아니라 접속한 주소 그대로 가게 한다
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # 해시가 붙은 정적 파일은 오래 캐시하고, HTML은 항상 새로 받게 한다
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico|mp4)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Storybook: 하위 경로. /storybook 으로 들어와도 /storybook/ 으로 보낸다
  location = /storybook {
    return 301 /storybook/;
  }
  location /storybook/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # docs(Next.js 정적 내보내기): .html 없는 주소(/components/button)를 처리한다
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
