name: Deploy docs & Storybook (Docker)

# main에 docs·Storybook·core가 바뀌어 push되면 자동 배포한다. Actions 탭에서 수동으로도 실행할 수 있다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/docs/**"
      - "packages/storybook/**"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - ".github/workflows/deploy-docs.yml"

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  # Docker Hub 이미지. 서버의 ~/nginx/docker-compose.yml에 적힌 이름과 같아야 한다.
  IMAGE: solution2025/mint
  # 156 서버의 ~/nginx/docker-compose.yml에 있는 서비스·컨테이너 이름
  SERVICE_NAME: mint

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Docker
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 이미지 안에서 npm ci와 docs·Storybook 빌드까지 모두 한다(Dockerfile)
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 어디에 어떤 이미지가 올라갔는지 실행 요약에 남긴다
      - name: Summary
        run: |
          echo "pushed: ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    environment: Docker
    steps:
      # 156 서버의 ~/nginx에 있는 docker-compose.yml로 이 서비스만 새 이미지로 다시 띄운다(다른 프로젝트와 같은 방식).
      # 서버의 compose에 `mint` 서비스가 먼저 등록되어 있어야 한다.
      - name: Deploy to 156 server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          ssh 156 << EOF
            set -e
            echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            docker pull ${{ env.IMAGE }}:latest

            echo "Stopping container"
            docker stop ${{ env.SERVICE_NAME }} || true

            echo "Removing container"
            docker rm ${{ env.SERVICE_NAME }} || true

            cd ~/nginx
            docker compose up -d --force-recreate ${{ env.SERVICE_NAME }}

            # 컨테이너가 실제로 떠 있는지 확인한다. 아니면 이 단계를 실패시킨다.
            docker ps --filter "name=^${{ env.SERVICE_NAME }}$" --filter status=running --format "{{.Names}} {{.Status}}" | grep -q .
            docker ps --filter "name=^${{ env.SERVICE_NAME }}$" --format "{{.Names}} {{.Status}}"

            echo "Done"
          EOF
