name: Publish @futurewiz-rms/mint

# 정식 배포 전이라 자동으로 올리지 않는다. Actions 탭에서 수동으로만 실행한다.
# 정식 배포 뒤 main push마다 올리려면 아래 `on`에 push(branches: [main], paths: packages/core/**)를 되살린다.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@futurewiz-rms"

      - name: 배포 여부 확인 (이미 올라간 버전이면 건너뜀)
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@futurewiz-rms/mint@$VERSION" version >/dev/null 2>&1; then
            echo "@futurewiz-rms/mint@$VERSION 은 이미 배포되어 있어 건너뜁니다."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run build
      - if: steps.version.outputs.publish == 'true'
        run: npm publish -w @futurewiz-rms/mint
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 배포한 버전의 태그와 GitHub Release를 만든다(저장소의 Releases 목록). 본문은 CHANGELOG의 해당 버전 섹션이다.
      - if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' packages/core/CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
